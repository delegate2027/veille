name: update-rss

on:
  schedule:
    # Toutes les 12 heures : flux YouTube et notices de la Commission des sondages.
    - cron: "23 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rss
  cancel-in-progress: false

jobs:
  update-rss:
    # Image figee plutot que ubuntu-latest, pour ne pas dependre d'une migration.
    runs-on: ubuntu-24.04

    steps:
      - name: Show trigger
        run: echo "Triggered by ${{ github.event_name }}"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update feed and push (with retry)
        # flux.xml et archives.xml sont entierement regeneres par rss.py. Deux
        # executions qui se chevauchent modifient donc les memes lignes : un
        # rebase entre en conflit a chaque fois, et sous "set -e" cela tuerait le
        # run avant meme la boucle de reessai. On ecarte plutot notre version,
        # on repart de l'etat distant le plus recent, et on regenere.
        run: |
          set -eo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          MAX_RETRIES=5
          COUNT=0

          until [ "$COUNT" -ge "$MAX_RETRIES" ]
          do
            echo "Attempt $((COUNT+1))/$MAX_RETRIES"

            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            python rss.py

            git add -A
            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi

            git commit -m "Auto update feed"

            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push failed (concurrent update detected), retrying..."
            COUNT=$((COUNT+1))
            sleep $((2 + RANDOM % 5))
          done

          echo "Failed after $MAX_RETRIES attempts"
          exit 1
