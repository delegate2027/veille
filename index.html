<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fc" />
  <meta name="description" content="Veille médiatique politique — flux d'actualité agrégés." />
  <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon_48x48.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon_16x16.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Veille médiatique politique</title>
</head>

<body>
  <div class="app-shell">
    <header class="site-header">
      <div class="brand">
        <div class="brand-copy">
          <h1>Veille médiatique politique</h1>
          <p>Actualités politiques agrégées</p>
        </div>
      </div>

      <div class="status-bar" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="feedCountDisplay"></span>
        <span class="status-separator" aria-hidden="true">•</span>
        <span id="lastUpdate"></span>
        <span class="loader" aria-hidden="true"></span>
      </div>
    </header>

    <main>
      <section class="feed" id="feed" aria-label="Flux d'actualité"></section>
    </main>

    <footer></footer>
  </div>

  <script src="script.js"></script>
</body>

</html>
