<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Veille médiatique politique — flux d'actualité agrégés et archives.">
  <link rel="icon" type="image/png" href="favicon/favicon_16x16.png">
  <link rel="stylesheet" type="text/css" href="style.css">
  <title>Veille médiatique politique</title>
</head>
<body>
  <div id="page">
    <header class="header">
      <h1 class="brand-title">Veille médiatique politique</h1>
      <p class="status">
        <span id="lastUpdate" class="status-text"></span>
        <svg id="pulse" class="pulse pulse-loading" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">
          <path d="M9.3 1.6 L4.7 8.7 H7.5 L6.7 14.4 L11.3 7.3 H8.5 Z" fill="currentColor" stroke="currentColor"
                stroke-width="0.8" stroke-linejoin="round"/>
        </svg>
        <span id="pulseStatus" class="status-text">chargement</span>
      </p>
      <nav class="view-nav">
        <a href="#flux" id="navFeed" class="view-tab">Flux</a>
        <a href="#archives" id="navArchive" class="view-tab">Archives</a>
      </nav>
    </header>

    <section id="viewFeed" class="view">
      <main id="feed" class="feed">
        <div class="loading">Chargement du flux…</div>
      </main>
    </section>

    <section id="viewArchive" class="view is-hidden">
      <div class="archive-controls">
        <div class="archive-search">
          <input id="archiveFilter" class="archive-filter" type="text" placeholder="Rechercher dans les archives." autocomplete="off">
          <label class="archive-option status-text"><input id="archiveSearchDesc" type="checkbox"> Inclure les descriptions</label>
        </div>
        <div class="archive-meta">
          <p class="archive-examples status-text">ex: nom, mot, date, mois, nom + date etc</p>
          <p class="archive-count status-text" id="archiveCount"></p>
        </div>
      </div>
      <main id="archive" class="feed">
        <div class="archive-hint">Chargement des archives…</div>
      </main>
    </section>

    <div class="footer"></div>
  </div>
  <script type="text/javascript" src="archives.js"></script>
  <script type="text/javascript" src="script.js"></script>
</body>
</html>
